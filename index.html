<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A0D08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyPizzeria">
<title>MyPizzeria</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* VOICE: caldo, di famiglia, sicuro come un buon pizzaiolo di quartiere
   IDEA: la bocca di un forno acceso vista dal banco, con le schede di vetro appoggiate sopra
   PICTURE: bagliore di brace che respira e scintille che salgono (di giorno: farina che cade)
   COLOUR and TYPE: rosso pomodoro, crema mozzarella, verde basilico, oro crosta; Instrument Serif per i numeri, Geist per il resto
   LAYOUT: colonna da telefono, schede di vetro, barra a schede in basso, un pulsante rosso per volta */
:root{
  --base:#F3EEE6;--ink:#2B1A12;--ink2:#6A5243;--glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.88);--stroke:rgba(255,255,255,.95);
  --line:rgba(43,26,18,.1);--sh:inset 0 1px 0 rgba(255,255,255,.9),0 10px 30px rgba(80,40,20,.12);
  --tom:#C8321F;--tomink:#FFFFFF;--basil:#23783A;--basilbg:rgba(46,139,69,.14);--crust:#8A5400;--crustbg:rgba(233,169,59,.24);
  --err:#A3261B;--errbg:rgba(220,60,40,.13);--fridge:#2F6FA8;--fridgebg:rgba(70,140,210,.16);
  --sel:rgba(255,255,255,.96);--sheet:rgba(247,242,235,.9);--scrim:rgba(43,26,18,.3);
  --g1:rgba(255,120,60,.35);--g2:rgba(255,200,90,.35);--g3:rgba(200,50,30,.22);--spark:rgba(255,255,255,.95);--sparkglow:rgba(255,255,255,.6);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --base:#170B06;--ink:#FFF3E6;--ink2:rgba(255,232,214,.76);--glass:rgba(255,236,220,.08);--glass2:rgba(255,236,220,.16);--stroke:rgba(255,226,200,.18);
  --line:rgba(255,226,200,.12);--sh:inset 0 1px 0 rgba(255,236,220,.22),0 14px 36px rgba(0,0,0,.35);
  --tom:#FF5B3D;--tomink:#1A0B05;--basil:#7BD88A;--basilbg:rgba(110,210,130,.14);--crust:#F6C055;--crustbg:rgba(246,180,70,.16);
  --err:#FF9B8F;--errbg:rgba(255,90,70,.16);--fridge:#8EC3F2;--fridgebg:rgba(120,180,240,.14);
  --sel:rgba(255,236,220,.24);--sheet:rgba(30,15,9,.9);--scrim:rgba(0,0,0,.45);
  --g1:rgba(255,95,30,.42);--g2:rgba(255,170,50,.28);--g3:rgba(190,30,10,.4);--spark:#FFB45A;--sparkglow:rgba(255,140,40,.8);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --base:#170B06;--ink:#FFF3E6;--ink2:rgba(255,232,214,.76);--glass:rgba(255,236,220,.08);--glass2:rgba(255,236,220,.16);--stroke:rgba(255,226,200,.18);
  --line:rgba(255,226,200,.12);--sh:inset 0 1px 0 rgba(255,236,220,.22),0 14px 36px rgba(0,0,0,.35);
  --tom:#FF5B3D;--tomink:#1A0B05;--basil:#7BD88A;--basilbg:rgba(110,210,130,.14);--crust:#F6C055;--crustbg:rgba(246,180,70,.16);
  --err:#FF9B8F;--errbg:rgba(255,90,70,.16);--fridge:#8EC3F2;--fridgebg:rgba(120,180,240,.14);
  --sel:rgba(255,236,220,.24);--sheet:rgba(30,15,9,.9);--scrim:rgba(0,0,0,.45);
  --g1:rgba(255,95,30,.42);--g2:rgba(255,170,50,.28);--g3:rgba(190,30,10,.4);--spark:#FFB45A;--sparkglow:rgba(255,140,40,.8);
  color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--base);color:var(--ink);font-family:'Geist',-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tom);outline-offset:2px}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--stroke);box-shadow:var(--sh)}

/* forno */
#oven{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 70% at 50% 108%,var(--g1),transparent 60%),var(--base)}
.glow{position:absolute;border-radius:50%;filter:blur(60px);animation:breathe 7s ease-in-out infinite alternate}
.glow.a{width:70vw;height:70vw;left:-15vw;bottom:-25vw;background:var(--g1)}
.glow.b{width:60vw;height:60vw;right:-20vw;bottom:-10vw;background:var(--g2);animation-duration:9s}
.glow.c{width:50vw;height:50vw;left:25vw;top:-25vw;background:var(--g3);animation-duration:11s}
@keyframes breathe{from{opacity:.55;transform:scale(1)}to{opacity:1;transform:scale(1.12)}}
.spark{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--spark);box-shadow:0 0 8px 2px var(--sparkglow);animation:rise var(--d,9s) linear infinite;animation-delay:var(--dl,0s);opacity:0}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}70%{opacity:.8}100%{transform:translate(var(--dx,20px),-105vh);opacity:0}}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .spark{animation-name:fall;top:-10px;bottom:auto;width:3px;height:3px;box-shadow:none;background:rgba(255,255,255,.95)}}
:root[data-theme="light"] .spark{animation-name:fall;top:-10px;bottom:auto;width:3px;height:3px;box-shadow:none;background:rgba(255,255,255,.95)}
@keyframes fall{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--dx,20px),105vh);opacity:0}}
@media (prefers-reduced-motion: reduce){.glow,.spark{animation:none}.spark{display:none}}

/* layout */
#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 200px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:2px 2px 0}
.top h1{margin:0;font-size:46px;line-height:1;letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.round{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:23px;cursor:pointer;flex:none;border:1px solid var(--stroke);background:var(--glass)}
.card{border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:28px;line-height:1.05;font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.lab{margin:0;font-size:13px;color:var(--ink2);font-weight:500}
.hint{margin:0;color:var(--ink2);font-size:13px;line-height:1.45}
.step-h{display:flex;align-items:center;gap:10px}
.sn{flex:none;width:30px;height:30px;border-radius:15px;background:var(--tom);color:var(--tomink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.grp{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.grp h3{margin:0;font-size:16px;font-weight:600}
details.more{border-top:1px solid var(--line);padding-top:4px}
details.more summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:44px;cursor:pointer;font-weight:600;font-size:15px;color:var(--ink)}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);margin-right:6px;transition:transform .2s}
details.more[open] summary::after{transform:rotate(-135deg)}
.morebody{display:flex;flex-direction:column;gap:10px;padding:4px 0 6px}
.hr{height:1px;background:var(--line);margin:2px 0}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* controlli */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke)}
.seg button{min-height:40px;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--ink2);font-size:14px;font-weight:500;cursor:pointer;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--sel);border-color:var(--stroke);color:var(--ink);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--stroke);background:var(--glass);color:var(--ink);font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tom);border-color:var(--tom);color:var(--tomink);font-weight:600}
.chip:disabled{opacity:.45;text-decoration:line-through;border-style:dashed;cursor:not-allowed}
.chip .serif{font-size:20px;line-height:1}
.stp{border-radius:18px;padding:10px 10px 8px;background:var(--glass);border:1px solid var(--stroke);display:flex;flex-direction:column;gap:4px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:4px}
.sb{width:44px;height:44px;border-radius:22px;border:1px solid var(--stroke);background:var(--glass2);font-size:22px;line-height:1;cursor:pointer;flex:none}
.num{font-family:'Instrument Serif',Georgia,serif;font-size:34px;line-height:1;font-weight:400;text-align:center;flex:1;white-space:nowrap}
.num small{font-family:'Geist',sans-serif;font-size:13px;color:var(--ink2);margin-left:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--tom) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:15px;background:#fff;margin-top:-11px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--tom)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:15px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.grid2 .sb{width:40px;height:40px;font-size:20px}
.grid2 .num{font-size:28px}
.num{overflow:hidden}
input[type=datetime-local].inp{-webkit-appearance:none;appearance:none;display:block;max-width:100%;text-align:left;min-height:48px;line-height:30px}
input[type=datetime-local]::-webkit-date-and-time-value{text-align:left}
.field{display:flex;flex-direction:column;gap:6px}
.inp{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass2);padding:8px 12px;font-size:16px;color:var(--ink)}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
.sw{position:relative;width:54px;height:32px;border-radius:16px;border:0;background:var(--line);cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:var(--glass2);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--basil)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:26px;border:0;background:var(--tom);color:var(--tomink);font-weight:600;font-size:16px;cursor:pointer;padding:0 18px;text-decoration:none}
.btn.ghost{background:var(--glass);border:1px solid var(--stroke);color:var(--ink)}
.btn.small{min-height:42px;font-size:14px;border-radius:21px}
.btn.danger{background:var(--errbg);color:var(--err)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;min-height:28px;padding:3px 10px;border-radius:14px;background:var(--glass);border:1px solid var(--stroke);font-size:13px;white-space:nowrap}
.pill.ok{background:var(--basilbg);border-color:transparent;color:var(--basil)}
.pill.warn{background:var(--crustbg);border-color:transparent;color:var(--crust)}
.pill.err{background:var(--errbg);border-color:transparent;color:var(--err)}
.pill.fr{background:var(--fridgebg);border-color:transparent;color:var(--fridge)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.45}
.note.warn{background:var(--crustbg);color:var(--ink)}
.note.ok{background:var(--basilbg)}
.note.err{background:var(--errbg)}
.note.fr{background:var(--fridgebg)}
.note svg{flex:none;margin-top:1px}
.term{border:0;background:none;padding:0;color:inherit;font:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:help}

/* dosi */
.dose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dz{border-radius:18px;padding:10px 12px;background:var(--glass);border:1px solid var(--stroke)}
.dz b{display:block;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:34px;line-height:1.05}
.dz span{font-size:13px;color:var(--ink2)}
.dz.hero{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--glass2)}
.dz.hero b{font-size:52px}

/* stile ideale */
.ideal{border-radius:26px;padding:18px;background:var(--tom);color:var(--tomink);display:flex;flex-direction:column;gap:10px;box-shadow:0 16px 40px rgba(200,50,30,.3)}
.ideal h3{margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:38px;line-height:1}
.ideal p{margin:0;font-size:15px;line-height:1.45}
.ideal .btn{background:rgba(255,255,255,.18);color:inherit;border:1px solid rgba(255,255,255,.4)}
.alt{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tom);border-radius:3px}

/* piano */
.day{margin:8px 0 2px;font-family:'Instrument Serif',Georgia,serif;font-size:26px;color:var(--crust)}
.st{display:grid;grid-template-columns:54px 18px minmax(0,1fr) auto;column-gap:10px;align-items:start}
.st .t{font-family:'Instrument Serif',Georgia,serif;font-size:24px;line-height:1.1}
.st .rail{display:flex;flex-direction:column;align-items:center;align-self:stretch}
.st .dot{width:14px;height:14px;border-radius:7px;background:var(--tom);margin-top:6px;flex:none}
.st .dot.rest{background:transparent;border:2px solid var(--ink2)}
.st .dot.fridge{background:var(--fridge)}
.st .dot.oven{background:var(--crust)}
.st .dot.eat{background:var(--basil)}
.st .ln{width:2px;flex:1;background:var(--line);margin-top:4px;min-height:24px}
.st h4{margin:2px 0 0;font-size:16px;font-weight:600}
.st p{margin:3px 0 16px;color:var(--ink2);font-size:14px;line-height:1.45}
.st.done h4,.st.done .t{opacity:.45;text-decoration:line-through}
.chk{width:34px;height:34px;border-radius:17px;border:1.5px solid var(--stroke);background:var(--glass);cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px}
.chk[aria-pressed="true"]{background:var(--basil);border-color:var(--basil);color:#fff}
.bell{border:0;background:none;padding:2px 0;cursor:pointer;color:var(--ink2);font-size:12px;display:inline-flex;align-items:center;gap:4px;min-height:28px}
.bell[aria-pressed="true"]{color:var(--tom)}
.fig{position:relative;height:170px}
.fig svg{position:absolute;inset:0;width:100%;height:100%}

/* tab bar */
#tabs{background:var(--sheet);position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;width:min(500px,calc(100% - 20px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-radius:28px;padding:6px}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;border:0;background:none;border-radius:22px;color:var(--ink2);font-size:11px;font-weight:500;cursor:pointer}
#tabs button[aria-current="page"]{background:var(--sel);color:var(--ink);font-weight:600}
#tabs button[aria-current="page"] svg{color:var(--tom)}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:4;width:min(480px,calc(100% - 32px))}
.cta .btn{width:100%;box-shadow:0 12px 30px rgba(200,50,30,.35)}

/* fogli */
#scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:none}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);z-index:21;width:min(520px,100%);max-height:88vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--stroke);transition:transform .28s ease;display:flex;flex-direction:column;gap:14px}
#sheet.open{transform:translate(-50%,0)}
#sheet h2{margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:32px;line-height:1.05}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 0}
#cook{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;gap:16px;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));background:var(--base);overflow-y:auto}
#cook.open{display:flex}
.clock{font-family:'Instrument Serif',Georgia,serif;font-size:min(26vw,120px);line-height:.9;text-align:center;letter-spacing:-.02em}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);z-index:40;max-width:calc(100% - 32px);padding:12px 18px;border-radius:20px;font-size:15px;transition:transform .3s;pointer-events:none}
#toast.on{transform:translate(-50%,0)}
.stars{display:flex;gap:6px}
.stars button{width:44px;height:44px;border-radius:22px;border:1px solid var(--stroke);background:var(--glass);cursor:pointer;font-family:'Instrument Serif',Georgia,serif;font-size:22px}
.stars button[aria-pressed="true"]{background:var(--crust);color:#fff;border-color:var(--crust)}
.entry{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.ph{width:100%;max-height:200px;object-fit:cover;border-radius:16px}
.wizdots{display:flex;gap:6px;justify-content:center}
.wizdots i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.wizdots i.on{background:var(--tom)}
.shelf{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:14px;background:var(--glass2);width:110px;flex:none}
.shelf div{height:20px;border-radius:5px;border:1px dashed var(--line);font-size:11px;color:var(--ink2);display:flex;align-items:center;padding:0 6px}
.shelf div.on{background:var(--crust);border:0;color:#fff;font-weight:600}
.shelf .heat{height:5px;border:0;border-radius:3px;background:var(--tom)}

/* MyPizzeria 2 */
:root{--dough:#F3E2C7;--doughln:#C9A877}
.rcards{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px;scroll-snap-type:x proximity}
.rcards::-webkit-scrollbar{display:none}

const FLEX=x=>['fridge','puntata','appretto'].includes(x.type)||(x.type==='rest'&&x.d>=45);
const seqTot=q=>q.reduce((a,x)=>a+(+x.d||0),0);
const seqFr=q=>q.filter(x=>x.type==='fridge').reduce((a,x)=>a+(+x.d||0),0);
function scaleFlex(q,targetMin,pred){ // allunga o accorcia solo i passi lunghi scelti da pred
  const fx=q.filter(pred).reduce((a,x)=>a+x.d,0),fixed=seqTot(q)-fx,k=(targetMin-fixed)/fx;
  if(!(fx>0)||k<.25)return null;

}
function adjustSeq(q0,Hh,fMode,F){
  let q=(q0||[]).map(x=>({...x,d:+x.d||0})).filter(x=>x.d>0);if(!q.length)return null;
  const T=Math.round(Hh*60);
  if(fMode==='none'){q=q.filter(x=>x.type!=='fridge'&&x.type!=='out');if(!q.some(FLEX))return null}
  if(fMode==='man'){const Fm=Math.round(F*60/5)*5;
    if(Fm<15){q=q.filter(x=>x.type!=='fridge'&&x.type!=='out')}
    else{const fr=q.filter(x=>x.type==='fridge');
      if(fr.length){const tot=seqFr(q);q=q.map(x=>x.type==='fridge'?{...x,d:Math.max(5,Math.round(x.d/tot*Fm/5)*5)}:x)}
      else{const i=Math.max(0,q.findIndex(x=>x.type==='staglio'||x.type==='appretto'));q.splice(i,0,{type:'fridge',label:'Frigo',d:Fm,note:''},{type:'out',label:'Fuori dal frigo',d:30,note:''})}}
    const r=scaleFlex(q,T,x=>FLEX(x)&&x.type!=='fridge');if(r)return r;
    return Math.abs(seqTot(q)-T)<10?q:null}
  if(Math.abs(seqTot(q)-T)<3)return q;
  return scaleFlex(q,T,FLEX);
}
function seqStagMode(q){const i=(q||[]).findIndex(x=>x.type==='staglio');if(i<0)return null;const j=q.findIndex(x=>(x.type==='puntata'||x.type==='fridge')&&!x.auto);return j<0||i<j?'subito':'dopo'}

  if(mode==='subito'){let k=-1;const lr=q.findIndex(x=>['puntata','fridge','appretto'].includes(x.type));q.forEach((x,n)=>{if(['mix','salt','knead','fold'].includes(x.type)&&(lr<0||n<lr))k=n});
    q.splice(k+1,0,st,{type:'rest',label:'Riposo dei panetti',d:20,note:'',auto:true},{type:'pirla',label:'Seconda pirlatura',d:5,note:'Stretta: dà la forza che manca senza puntata.',auto:true})}

function deriveX(c){

const CFG_KEYS=['idro','salt','fat','flour','customW','method','folds','stag','yeast','n','w','pdr','pdrT','teglia','water','waterT','qMode','flourPer','shortMode'];
function cfgDet(c){const o={};for(const k of CFG_KEYS)o[k]=c[k];return o}
function detToCfg(t){ // dati salvati nel diario della versione 1 → impostazioni
  t=t||{};const o={};
  if(t.idro!=null)o.idro=+t.idro;if(t.salt!=null)o.salt=+t.salt;if(t.fat!=null)o.fat=+t.fat;

function derive(c){

  if(c.room<15||c.room>35)errs.push('La formula funziona tra 15° e 35° di stanza.');

  const cEq0=t.H-(1-ff)*F;

  if(y.c<6&&F<t.H*.5){short=true; // con tanto frigo vale la formula: le ricette rapide sono senza frigo
   hRec=.02*(3/Math.max(y.c,1.5))*Math.pow(2,(21-Teff)/9);
    const w=clamp((6-y.c)/3,0,1);const hB=Math.exp(w*Math.log(hRec)+(1-w)*Math.log(y.h));if(c.shortMode!=='formula')h=hB;hRec=hB}
  h*=boost;
  const pg={1:1/300,2:.005,3:.01}[c.pdrT]||.005;
  const tot=c.n*c.w, C=c.idro*(+c.salt+ +c.fat)+1e3*(c.idro+100), f=tot*c.pdr/100;

  const W=flourW(c), Wr=Wreq(t.H), maxH=maxHoursW(W);

}

const band=(x,[a,b],s)=>x<a?Math.exp(-(((a-x)/s)**2)):x>b?Math.exp(-(((x-b)/s)**2)):1;

function ovenFit(id,o){

const SALT={napoletana:[45,55],contemporanea:[40,55],tondaromana:[40,55],teglia:[20,40],pala:[30,45],padellino:[40,55],padella:[40,55]};

      {k:'idro',f:band(+c.idro,[st.idro[0],st.idro[1]+(o.tmax<380&&!st.tray&&id!=='napoletana'?3:0)],4),t:`Acqua al ${io}% (ora ${c.idro}%)`,set:['cfg.idro',io]},

      {k:'W',f:d.W<st.W[0]?Math.exp(-(((st.W[0]-d.W)/50)**2)):1,t:`Farina più forte (la tua è W ${d.W})${fl?`: per esempio ${fl.name.replace(/ \(.*\)/,'')}, W ${fl.W}`:''}`,set:fl?['cfg.flour',fl.id]:null},

      r={pre,shelf,surf,setup:`${surf.charAt(0).toUpperCase()+surf.slice(1)} sul ripiano ${shelf} (contando dal basso), statico ${t}° per ${pre} minuti${g?', poi grill al massimo':''}.`,bake:base,how:(g?'Col grill acceso. ':'')+how,grill:g,between:surf==='leccarda rovesciata'?2:4};

function howKey(s,p){
  const st=STY[p.style]||{};
  switch(s.tag){
    case'mix':return p.method==='planetaria'?null:'mix';
    case'salt':return 'pinch';
    case'knead':return p.method==='mano'?'knead':null;
    case'fold':return p.method==='nk'?'fold':'fold3';
    case'staglio':return 'staglio';
    case'pirla2':return 'pirla';
    case'stretch':return st.tray?'tray':p.style==='tondaromana'?'roll':'stretch';
    case'bake':return st.tray?null:'peel';
  }return null;
}
function howBox(key,big){
  const h=HOW[key];if(!h)return '';const fr=h.f(),n=fr.length,T=n*2.4;
  return `<div class="how${big?' big':''}" style="--T:${T}s;--hl:hl${n};--xf:xf${n}">${big?'':`<div class="rowb"><span style="font-weight:600;font-size:15px">Come si fa: ${esc(h.t.toLowerCase())}</span><span class="lab">si ripete</span></div>`}
   <div class="frs">${fr.map(([svg,cap],i)=>`<div class="fm" style="--dl:${(-(n-i)*T/n).toFixed(2)}s">${svg}<span>${i+1} · ${esc(cap)}</span></div>`).join('')}</div><div class="pb"><i></i></div></div>`;
}

const fDay=ms=>{const d=new Date(ms),t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);const k=Math.round((x-t)/864e5);return k===0?'Oggi':k===1?'Domani':k===-1?'Ieri':GG[d.getDay()].slice(0,3).replace(/^./,m=>m.toUpperCase())+' '+d.getDate()};
const rById=id=>S.recipes.find(r=>r.id===id);
function rRating(r){const e=S.diary.find(x=>x.rid===r.id&&x.rating);return e?e.rating:0}
function recipesSorted(){return S.recipes.slice().sort((a,b)=>rRating(b)-rRating(a)||(b.used||b.created||0)-(a.used||a.created||0))}
function seqCounts(q){const n=t=>q.filter(x=>x.type===t).length;return {fold:n('fold'),pirla:n('pirla')+n('staglio')}}
function rMeta(r){const q=r.seq||[],c=seqCounts(q),fr=seqFr(q);
  return [fH(seqTot(q)/60),fr?fH(fr/60)+' frigo':'',c.fold?c.fold+(c.fold>1?' pieghe':' piega'):'',c.pirla>1?c.pirla+' pirlature':'',r.det&&r.det.idro?r.det.idro+'%':''].filter(Boolean).slice(0,3).join(' · ')}
const rTag=r=>r.kind==='import'?'Importata':'La tua'+(rRating(r)?' · '+rRating(r)+'★':'');
const sMeta=id=>{const st=STY[id];return st.H[0]+'–'+st.H[1]+' h · '+st.idro[0]+'–'+st.idro[1]+'%'};
function rCard(kind,id){

  if(kind==='c'){const st=STY[id];return `<button class="rc" data-a="pickstyle" data-v="${id}" aria-pressed="${!c.rid&&c.style===id}"><span class="tg">Classica</span><span class="nm">${esc(st.name)}</span><span class="mt">${sMeta(id)}</span></button>`}
  const r=rById(id);return `<button class="rc" data-a="pickrec" data-v="${r.id}" aria-pressed="${c.rid===r.id}"><span class="tg">${esc(rTag(r))}</span><span class="nm">${esc(r.name)}</span><span class="mt">${esc(rMeta(r))}</span></button>`;
}
function splitRuns(c,d){ // tratti fuori / in frigo, in ore
  let runs=[];
  if(d.q){for(const x of d.q){const f=x.type==='fridge'?1:0,h=x.d/60,l=runs[runs.length-1];if(l&&l.f===f)l.h+=h;else runs.push({f,h})}}
  else{const p=buildPlan(c);if(p.err)return [];for(const g of p.segs){const f=g.f?1:0,h=(Math.min(g.b,p.end)-g.a)/H,l=runs[runs.length-1];if(h<=0)continue;if(l&&l.f===f)l.h+=h;else runs.push({f,h})}}
  return runs.filter(r=>r.h>.01);
}
function vFridge(c,d){
  const runs=d.errs.length?[]:splitRuns(c,d),F=runs.filter(r=>r.f).reduce((a,r)=>a+r.h,0),tot=runs.reduce((a,r)=>a+r.h,0)||1;
  const mode={auto:d.q?'dalla ricetta':'automatico',man:'scelto da te',none:'niente'}[c.fMode]||'automatico';

function thawPlan(remE){ // remE: ore equivalenti di lievitazione rimaste al momento del congelamento
  const ff=fridgeFactor(),r=remE==null?2.5:remE,lag=.75,minOut=1.5;
  let Fth=18,out=r-ff*(Fth-7)+lag;
  if(out<minOut){Fth=clamp(7+(r+lag-minOut)/ff,10,18);out=Math.max(minOut,r-ff*(Fth-7)+lag)}
  out=clamp(out,minOut,4);
  const amb=clamp(2.5+r,3.5,6);
  return {Fth:Math.round(Fth*2)/2,out:Math.round(out*4)/4,amb:Math.round(amb*2)/2,noRe:r<1.5};
}

function idroOpt(c,d,sid){
  const st=STY[sid||c.style]||STY.contemporanea,o=curOven(),hot=o.tmax>=380;
  let v=Math.round((st.idro[0]+st.idro[1])/2);const why=[];
  const dW=clamp(Math.round((d.W-(st.W[0]+st.W[1])/2)/40),-2,2);
  if(dW>0)why.push(`la farina è forte (W ${d.W}) e assorbe più acqua`);if(dW<0)why.push(`la farina è più debole (W ${d.W}) e ne regge meno`);v+=dW;
  if(d.H>=36){v+=1;why.push('la lievitazione è lunga')}else if(d.H<6){v-=2;why.push('con poche ore un impasto meno idratato è più facile da gestire')}
  const ext=(!st.tray&&!hot&&(sid||c.style)!=='napoletana')?3:0;
  if(ext&&o.tmax<=300){v+=2;why.push(`il forno arriva a ${o.tmax}°: la cottura è più lunga e un po' d'acqua in più la tiene morbida`)}
  if(c.method==='nk'){v+=1;why.push('il no-knead lavora meglio con impasti più idratati')}
  if(subito(c)&&d.W<280){v-=1;why.push('con lo staglio subito l\'impasto prende meno forza')}
  v=clamp(v,st.idro[0],st.idro[1]+ext);
  return {v,why};
}

function vLevel(p){
  if(p.stag==='subito')return `<section class="card glass"><h2>Segnalivello</h2><p class="hint">Con lo staglio subito non c'è una massa da misurare: guarda i panetti. Sono pronti quando sono quasi raddoppiati, rilassati e con bollicine sotto.</p></section>`;
  const k=S.cont,cdef=CONTAINERS.find(x=>x.id===k.id)||CONTAINERS[2];
  let area,cap;
  if(cdef.shape==='r'){const r=(cdef.d-.6)/2;area=Math.PI*r*r;cap=cdef.cap}
  else if(k.shape==='r'){const r=k.d/2;area=Math.PI*r*r;cap=area*k.h/1000}
  else{area=k.l*k.w;cap=area*k.h/1000}
  const mass=p.n*p.w,V=mass/1.1,h0=k.h0||V/area,need=V*2.4/1000;

     <div class="grid3">${k.shape==='r'?`<label class="field"><span class="lab">Ø interno cm</span><input class="inp" type="number" inputmode="decimal" data-k="cont.d" value="${k.d}"></label>`:`<label class="field"><span class="lab">Lungo cm</span><input class="inp" type="number" inputmode="decimal" data-k="cont.l" value="${k.l}"></label><label class="field"><span class="lab">Largo cm</span><input class="inp" type="number" inputmode="decimal" data-k="cont.w" value="${k.w}"></label>`}<label class="field"><span class="lab">Alto cm</span><input class="inp" type="number" inputmode="decimal" data-k="cont.h" value="${k.h}"></label></div>`:''}
   ${cap<need?note('warn',`Troppo piccolo: per ${fg(mass)} g d'impasto serve almeno ${nf(need,1)} l.`):''}
   <div class="dose"><div class="dz"><b>${nf(h0,1)} cm</b><span>Partenza (stimata)</span></div><div class="dz"><b>${nf(h0*2,1)} cm</b><span>Pronto per lo staglio (×2)</span></div></div>
   ${p.F>0?`<p class="hint">In frigo cresce poco: all'uscita è normale trovarlo a ×1,3–1,5 (${nf(h0*1.3,1)}–${nf(h0*1.5,1)} cm).</p>`:''}
   <label class="field"><span class="lab">Hai misurato la partenza? (cm)</span><input class="inp" type="number" inputmode="decimal" data-k="cont.h0" value="${k.h0||''}" placeholder="${nf(h0,1)}"></label>
  </section>`;
}
function drawCurve(){
  const box=$('#curve');const p=S.plan;if(!box||!p)return;
  const W=box.clientWidth,Hh=box.clientHeight;if(!W)return;
  const a=p.start,b=p.end,span=b-a,X=t=>16+(W-32)*(t-a)/span,Y=v=>Hh-24-(Hh-44)*(v-1)/1.4;
  const vol=t=>{const e=eqUntil(p,t)/p.c;return 1+1.3*Math.pow(clamp(e,0,1.15),1.25)};
  let d='';for(let i=0;i<=80;i++){const t=a+span*i/80;d+=(i?'L':'M')+X(t).toFixed(1)+' '+Y(vol(t)).toFixed(1)}
  const fr=p.segs.filter(g=>g.f).map(g=>`<rect x="${X(g.a).toFixed(1)}" y="8" width="${Math.max(2,X(g.b)-X(g.a)).toFixed(1)}" height="${Hh-32}" rx="8" fill="var(--fridgebg)"/>`).join('');
  const now=Date.now(),nx=now>a&&now<b?`<line x1="${X(now)}" x2="${X(now)}" y1="6" y2="${Hh-24}" stroke="var(--crust)" stroke-width="2" stroke-dasharray="4 4"/><circle cx="${X(now)}" cy="${Y(vol(now))}" r="6" fill="var(--crust)"/>`:'';
  const st=p.steps.find(s=>s.tag==='staglio');
  const sx=st?`<line x1="${X(st.t)}" x2="${X(st.t)}" y1="${Hh-30}" y2="${Hh-22}" stroke="var(--ink2)"/><text x="${X(st.t)}" y="${Hh-6}" text-anchor="middle" font-size="11" fill="var(--ink2)">staglio</text>`:'';
  box.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Volume previsto dell'impasto nel tempo">${fr}
   <line x1="16" x2="${W-16}" y1="${Y(2)}" y2="${Y(2)}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${W-16}" y="${Y(2)-5}" text-anchor="end" font-size="11" fill="var(--ink2)">×2</text>
   <path d="${d}" fill="none" stroke="var(--tom)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${nx}${sx}
   <text x="16" y="${Hh-6}" font-size="11" fill="var(--ink2)">${fT(a)}</text>${W>320||!st?`<text x="${W-16}" y="${Hh-6}" text-anchor="end" font-size="11" fill="var(--ink2)">${fT(b)}</text>`:''}</svg>`;
}

function vSos(){
  const s=S.sos,ph=s.phase,list=PROBS.filter(x=>x[2].includes(ph)),sel=s.sel.filter(id=>list.some(x=>x[0]===id));
  const blocked=new Set(sel.map(id=>(PROBS.find(x=>x[0]===id)||[])[3]).filter(Boolean));

  let out=`<button class="back" data-a="back">← Indietro</button><header class="top"><div><h1 class="serif">SOS impasto</h1><p>Respira: quasi tutto si salva.</p></div></header>
  ${SAMPLE?'<button class="btn ghost" data-a="askopen">Chiedi al pizzaiolo</button>':''}

   <span class="lab">Cosa non va? Anche più di uno</span>

  </section>`;
  if(sel.length){
    if(combo)out+=note(ph==='cotta'?'warn':'ok',esc(combo[1]),ph==='cotta'?ic.info:ic.ok);
    if(ph==='cotta'){
      out+=`<section class="card glass"><h2>La prossima volta</h2>${sel.map(id=>`<div><div style="font-weight:600">${esc(PROBS.find(x=>x[0]===id)[1])}</div><p class="hint">${esc(FIX[id].next)}</p></div>`).join('')}
       <button class="btn" data-a="sos2diary">Salva nel diario</button></section>`;
    }else{
      out+=sel.map(id=>{const f=FIX[id],L=f[ph]||f.any||[];return `<section class="card glass"><h2>${esc(PROBS.find(x=>x[0]===id)[1])}</h2>${L.map((t,i)=>`<div class="rowb" style="justify-content:flex-start;align-items:flex-start"><span class="pill" style="min-width:28px;justify-content:center">${i+1}</span><span style="font-size:15px;line-height:1.45">${esc(t)}</span></div>`).join('')}<p class="hint">La prossima volta: ${esc(f.next)}</p></section>`}).join('');
      if(S.plan&&S.plan.active&&(sel.includes('tight')||sel.includes('under')))out+=`<section class="card glass"><h2>Dagli più tempo</h2><p class="hint">Sposto più avanti tutti i passi che restano, forno compreso.</p><div class="grid3">${[30,60,90].map(m=>`<button class="btn small ghost" data-a="shiftrest" data-v="${m}">+${m} min</button>`).join('')}</div></section>`;
      if(S.plan&&S.plan.active&&sel.includes('over'))out+=`<section class="card glass"><h2>Anticipa</h2><p class="hint">Sposto prima tutti i passi che restano, forno compreso.</p><div class="grid3">${[30,60,90].map(m=>`<button class="btn small ghost" data-a="shiftrest" data-v="-${m}">−${m} min</button>`).join('')}</div></section>`;
    }
  }
  if(hasLaser())out+=vDoughT();
  out+=vFermo()+vFrozen();

function doughAdvice(Tm,ph){
  const p=S.plan&&S.plan.active?S.plan:null,c=S.cfg,d=derive(c),now=Date.now();
  const room=p?p.room:c.room,fT=S.fridgeT||4;
  const inFr=p&&p.segs.some(g=>g.f&&g.a<=now&&g.b>now);
  const L=[];let shift=0,head;
  const warmTime=(T0,Tt,tau)=>T0>=Tt?0:(room<=Tt+.5?null:tau*Math.log((room-T0)/(room-Tt)));
  if(ph==='impasto'){
    const tgt=d.target,diff=Tm-tgt;
    head=`Appena impastato dovrebbe stare sui ${tgt}°.`;
    if(Math.abs(diff)<1.5)L.push('È giusto così: vai avanti col piano.');
    else{const nw=clamp(Math.round(d.Tw-3*diff),2,40);
      L.push(diff<0?`È ${nf(-diff,0)}° sotto: parte più lento.`:`È ${nf(diff,0)}° sopra: parte più veloce.`);
      L.push(diff<0?'Tienilo al tiepido per la prima ora: forno spento con la luce accesa (26–28°), poi torna in stanza.':'Tienilo nel punto più fresco della casa (16–18°) per la prima ora.');
      L.push(`La prossima volta usa l'acqua a circa ${nw}° invece di ${fg(d.Tw)}°.`)}
  }else if(ph==='frigo'||(inFr&&ph==='puntata')){
    const fr=inFr&&ph==='puntata';
    head=fr?`In frigo dovrebbe arrivare verso i ${fT}–${fT+2}°.`:`Uscito dal frigo deve tornare almeno a 16–18° prima dello staglio o della stesura.`;
    if(fr){if(Tm>fT+4)L.push(`A ${Tm}° in frigo lavora ancora parecchio: è normale nelle prime 2–3 ore, poi deve scendere. Se il frigo stesso è sopra i 6°, abbassalo.`);else L.push('Va bene.')}
    else{const t=warmTime(Tm,17,p&&p.stag==='subito'?.7:1.2);
      if(t===0)L.push('È già pronto per essere lavorato.');
      else if(t==null)L.push(`La stanza (${room}°) è troppo fredda per portarlo a 17°: mettilo nel forno spento con la luce accesa.`);
      else{L.push(`Gli servono circa ${fH(t)} a ${room}° per arrivare a 17°. Nel forno spento con la luce accesa ci mette circa la metà.`);if(t>.75)shift=Math.round((t-.5)*60/15)*15}}
  }else{
    const exp=ph==='stesura'?20:room,lo=ph==='stesura'?18:room-1.5,hi=ph==='stesura'?24:room+1.5;
    head=ph==='stesura'?'Per stendere bene l\'impasto sta tra 18° e 24°.':`Mentre lievita dovrebbe stare sui ${room}°, la temperatura della stanza.`;
    if(Tm>=lo&&Tm<=hi)L.push('È nel giusto: vai avanti col piano.');
    else if(Tm<lo){const r=Math.pow(2,(exp-Tm)/9);
      L.push(ph==='stesura'?'È freddo: si ritirerà e sarà tenace.':`È più freddo del previsto: va circa ${nf((r-1)*100,0)}% più lento.`);
      L.push('Portalo a 24–27°: forno spento con la luce accesa, coperto. Rimisura dopo 30 minuti e non superare i 30°.');
      if(p){const rest=Math.max(0,(p.end-now)/H);const ex=ph==='stesura'?(warmTime(Tm,18,.7)||.5):rest*(r-1)*.5;shift=Math.min(120,Math.round(ex*60/15)*15);if(shift>0)L.push(`Se invece lo lasci dov'è, conta circa ${shift} minuti in più.`)}}
    else{const r=Math.pow(2,(Tm-exp)/9);
      L.push(`È più caldo del previsto: va circa ${nf((r-1)*100,0)}% più veloce.`);
      L.push('Rallentalo: il punto più fresco della casa (16–18°), oppure 30–60 minuti in frigo e poi riprendi il piano.');
      if(p){const rest=Math.max(0,(p.end-now)/H);shift=-Math.min(120,Math.round(rest*(1-1/r)*60/15)*15);if(shift<0)L.push(`Se resta a ${Tm}°, sarà pronto circa ${-shift} minuti prima.`)}}
  }
  return {head,L,shift};
}
function vDoughT(){
  const s0=S.sos,Tm=s0.dT==null?20:s0.dT,ph=s0.phase==='cotta'?'stesura':s0.phase;
  const a=doughAdvice(Tm,ph);
  return `<section class="card glass"><h2>Temperatura dell'impasto</h2>
   <p class="hint">Col laser punta al centro dell'impasto appena scoperto: legge la superficie, quindi su una massa grande è una stima.</p>
   ${stepper('sos.dT',Tm,{label:'Misurata',min:0,max:40,unit:'°'})}
   <p style="margin:0;font-size:15px">${esc(a.head)}</p>
   ${a.L.map(t=>`<p class="hint" style="font-size:14px;color:var(--ink)">• ${esc(t)}</p>`).join('')}

  let b='';

  if(WIZ===2)b=`<h2>La tua farina</h2><label class="field"><span class="lab">Quella che usi di più</span><select class="inp" data-k="cfg.flour">${FLOURS.map(f=>`<option value="${f.id}"${f.id===S.cfg.flour?' selected':''}>${esc(f.name)}${f.W?' · W '+f.W:''}</option>`).join('')}</select></label>
    ${S.cfg.flour==='cust'?`<label class="field"><span class="lab">W</span><input class="inp" type="number" inputmode="numeric" data-k="cfg.customW" value="${S.cfg.customW}"></label>`:''}<p class="hint">Il W è scritto sul pacco di quasi tutte le farine per pizza.</p>`;
  if(WIZ===3)b=`<h2>La pizza che fai di più</h2><div class="chips">${STY_IDS.map(id=>`<button class="chip" data-a="usestyle" data-v="${id}" aria-pressed="${S.cfg.style===id}">${esc(STY[id].name)}</button>`).join('')}</div><p class="hint">${esc(STY[S.cfg.style].d)}</p>`;
  if(WIZ===4)b=`<h2>E di notte?</h2>${toggle('S.night',S.night,'Avvisami se un passo cade tra le 23 e le 7','Così non ti ritrovi a fare pieghe alle 3.')}`;

/* ============ cucina ============ */
let wake=null,actx=null,tick=null;
function beep(){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.65)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function curStep(p){const now=Date.now();const L=p.steps.filter(s=>!p.done[s.id]&&s.kind!=='eat');let cur=null;for(const s of L){if(s.t<=now)cur=s}const next=L.find(s=>s.t>now&&s!==cur);return {cur:cur||next,next:cur?next:L.find(s=>s.t>(next?next.t:0))}}
let COOKID='';
function cookClock(p){const {cur,next}=curStep(p),now=Date.now();if(!cur)return {hh:0,txt:''};const started=cur.t<=now,target=started?(next?next.t:cur.t+cur.d*M):cur.t,left=Math.max(0,target-now);
  const hh=Math.floor(left/H),mm=Math.floor(left%H/M),ss=Math.floor(left%M/1000);return {hh,txt:hh?hh+':'+pad(mm):pad(mm)+':'+pad(ss)}}
function vCook(){
  const p=S.plan;if(!p)return '';
  const {cur,next}=curStep(p),now=Date.now();
  if(!cur)return `<div class="rowb"><span class="lab">Modalità cucina</span><button class="round" data-a="cookclose" aria-label="Chiudi">${ic.x}</button></div><h2 class="serif" style="font-size:44px;margin:0">Fatto tutto. Buon appetito!</h2>`;
  const started=cur.t<=now,{hh,txt}=cookClock(p);COOKID=cur.id+(started?'s':'w');
  const folds=p.steps.filter(s=>s.tag==='fold'),fi=folds.indexOf(cur);
  return `<div class="rowb"><span class="lab">${started?'Adesso':'Prossimo passo alle '+fT(cur.t)}</span><button class="round" data-a="cookclose" aria-label="Chiudi">${ic.x}</button></div>
   <h2 class="serif" style="font-size:44px;line-height:1;margin:0">${esc(cur.title)}</h2>
   <p style="margin:0;font-size:18px;line-height:1.5">${esc(cur.sub)}</p>
   ${(k=>k?howBox(k):'')(howKey(cur,p))}
   ${fi>=0?`<div class="wizdots">${folds.map((f,i)=>`<i class="${p.done[f.id]||i<fi?'on':''}" style="width:40px;height:8px"></i>`).join('')}</div>`:''}
   <div class="card glass" style="align-items:center"><span class="lab">${started?(next?'al prossimo passo ('+esc(next.title.toLowerCase())+')':'alla fine'):'mancano'}</span>
    <div class="clock" id="clock">${txt}</div><span class="lab" id="clockU">${hh?'ore e minuti':'minuti e secondi'}</span></div>
   <div class="grid2"><button class="btn ghost" data-a="plus5">+5 min</button><button class="btn" data-a="cookdone" data-v="${cur.id}">Fatto</button></div>
   ${!S.cook.audio?'<p class="hint">Tieni l\'app aperta: suona e vibra a ogni passo.</p>':''}`;
}
async function openCook(){
  try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC()}if(actx&&actx.state==='suspended')await actx.resume();S.cook.audio=true}catch(e){}
  try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}
  $('#cook').innerHTML=vCook();$('#cook').classList.add('open');
  clearInterval(tick);tick=setInterval(()=>{if(!$('#cook').classList.contains('open'))return;const p=S.plan,{cur}=curStep(p),k=cur?cur.id+(cur.t<=Date.now()?'s':'w'):'';
    if(k&&k===COOKID&&$('#clock')){const c=cookClock(p);$('#clock').textContent=c.txt;$('#clockU').textContent=c.hh?'ore e minuti':'minuti e secondi'}else $('#cook').innerHTML=vCook()},1000);
}
function closeCook(){$('#cook').classList.remove('open');clearInterval(tick);try{wake&&wake.release()}catch(e){}wake=null}
setInterval(()=>{const p=S.plan;if(!p||!p.active)return;const now=Date.now();let ch=false;
  for(const s of p.steps){if(s.rem&&!p.fired[s.id]&&!p.done[s.id]&&s.t<=now&&s.t>now-90e3){p.fired[s.id]=1;ch=true;toast(fT(s.t)+' · '+s.title);beep()}
    if(s.tag==='fridgeOut'&&s.rem&&!p.fired[s.id+'p']&&s.t-15*M<=now&&s.t-15*M>now-90e3){p.fired[s.id+'p']=1;ch=true;toast('Fra 15 minuti: fuori dal frigo')}}
  if(ch)save();
  if(location.hash==='#piano'&&!SHEET){const c=curStep(p).cur,k=c?c.id+(c.t<=now?'s':'w'):'';if(k!==PIANOK){PIANOK=k;render(true)}}},15000);
let PIANOK='';

        <button class="sb" data-a="sqmv" data-v="${i}:-1" aria-label="Sposta su"${i?'':' disabled'}>↑</button><button class="sb" data-a="sqmv" data-v="${i}:1" aria-label="Sposta giù"${i<q.length-1?'':' disabled'}>↓</button><button class="sb" data-a="sqdel" data-v="${i}" aria-label="Togli il passo">${ic.x}</button></div>

function rerenderSheet(){const sh=$('#sheet'),y=sh.scrollTop;if(!SHEET||SHEET==='testres'||SHEET==='gloss')return;const ae=document.activeElement,fk=ae&&ae.id;sh.innerHTML=sheetHTML(SHEET);sh.scrollTop=y;if(fk){const f=document.getElementById(fk);if(f&&sh.contains(f))f.focus()}}
function closeSheet(){$('#sheet').classList.remove('open');$('#scrim').style.display='none';SHEET=null;fab();if(!S.setup){S.setup=true;save();render()}}
let tT=null;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('on'),3200)}

/* ============ stato: get/set ============ */
function root(r){return r==='cfg'?S.cfg:r==='ov'?curOven():r==='t'?TEST:r==='d'?DRAFT:r==='sos'?S.sos:r==='cont'?S.cont:r==='S'?S:r==='e'?E:r==='i'?IMP:r==='a'?ASK:null}
function setK(k,v){const p=k.split('.');if(p[0]==='e'&&E)E.dirty=true;let o=root(p[0]);for(let i=1;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]={};o=o[p[i]]}o[p[p.length-1]]=v}
function getK(k){const p=k.split('.');let o=root(p[0]);for(let i=1;i<p.length;i++){if(o==null)return undefined;o=o[p[i]]}return o}
function afterCfg(k){
  const c=S.cfg;
  if(k==='cfg.mode'){if(c.mode==='hours'){c.H=clamp(Math.round((c.end-c.start)/H),2,96);c.start=c.end-c.H*H}else{c.start=c.end-c.H*H}}
  if(k==='cfg.end'&&c.mode==='hours')c.start=c.end-c.H*H;
  if(k==='cfg.H'){c.start=c.end-c.H*H}
  if(k==='cfg.stag'&&c.method==='nk')c.folds=clamp(c.folds+(c.stag==='subito'?1:-1),2,6);
  if(k==='cfg.fMode'&&c.fMode==='man'){const d=deriveX({...c,fMode:'auto'});c.F=d.errs.length?0:Math.round(d.F*2)/2}
  if(k==='cfg.qMode'&&c.qMode==='flour'){c.flourPer=Math.max(50,Math.round(c.w/doughK(c)/5)*5)}
  if(k==='cfg.n'&&c.freezeN>c.n-1)c.freezeN=Math.max(0,c.n-1);
  if(['cfg.idro','cfg.salt','cfg.fat','cfg.flour','cfg.customW','cfg.method','cfg.folds','cfg.stag','cfg.teglia','cfg.pdr','cfg.pdrT','cfg.w','cfg.flourPer','cfg.water','cfg.waterT'].includes(k))c.mod=true;
  if(['cfg.idro','cfg.salt','cfg.fat','cfg.H','cfg.method','cfg.teglia','cfg.style'].includes(k)&&k!=='cfg.style')c.maestro=null;
}

function styleCfg(c,v){const st=STY[v];Object.assign(c,st.def);c.teglia=st.tray;c.style=v;if(c.mode==='hours'&&(c.H<st.H[0]||c.H>st.H[1])){c.H=clamp(st.Hdef||st.H[0],st.H[0],st.H[1]);c.start=c.end-c.H*H}const d=derive(c);if(!d.errs.length)c.idro=idroOpt(c,d).v;return c}
function after(k){if(k.startsWith('cfg.'))afterCfg(k);else if(k.startsWith('e.c.')&&E){const c=E.c;if(k==='e.c.stag'&&c.method==='nk')c.folds=clamp(c.folds+(c.stag==='subito'?1:-1),2,6);if(k==='e.c.style')c.teglia=!!(STY[c.style]||{}).tray}}
function liveE(){if(!E)return;const d=deriveX(edCfg()),iv=document.getElementById('eIdroV'),is=document.getElementById('eIdroS');if(iv)iv.textContent=E.c.idro+'%';if(is)is.innerHTML=vIdroS(E.c,d)}
let LASTTAB='stasera',HOWPREV=null;
function applyStyle(v){const st=STY[v],c=S.cfg;c.mod=false;Object.assign(c,st.def);c.teglia=st.tray;c.style=v;c.rid=null;c.rseq=null;c.rname='';if(c.fMode==='auto'||!c.fMode)c.fMode='auto';if(c.qMode==='flour')c.flourPer=Math.max(50,Math.round(st.def.w/doughK(c)/5)*5);
  if(c.mode==='hours'&&(c.H<st.H[0]||c.H>st.H[1])){c.H=clamp(st.Hdef||st.H[0],st.H[0],st.H[1]);c.start=c.end-c.H*H}
  const d=derive(c);if(!d.errs.length)c.idro=idroOpt(c,d).v;c.maestro=null}
function applyRecipe(r){const c=S.cfg;c.mod=false;Object.assign(c,{freezeN:0,pdr:0},r.det||{});c.style=r.style||c.style;if(!r.det||r.det.teglia==null)c.teglia=!!(STY[c.style]||{}).tray;
  c.rid=r.id;c.rname=r.name;c.rseq=JSON.parse(JSON.stringify(r.seq||[]));c.fMode='auto';
  const tot=seqTot(c.rseq)/60;if(c.mode==="hours"){c.H=Math.round(tot*12)/12;c.start=c.end-c.H*H;if(c.start<Date.now()+5*M){c.end=defEnd(c.H);c.start=c.end-c.H*H}}
  r.used=Date.now()}
/* ============ render ============ */
const TABS={stasera:vStasera,piano:vPiano,ricette:vRicette,forno:vForno,diario:vDiario,sos:vSos};
function fab(){const f=$('#fab'),h=location.hash.slice(1)||'stasera',c=!!$('#ctaBox').innerHTML;f.style.display=h==='sos'?'none':'';f.classList.toggle('inl',c);f.style.bottom=`calc(${c?84:96}px + env(safe-area-inset-bottom,0px))`}
let curTab='';
function render(keep){
  let h=location.hash.slice(1);if(!TABS[h])h='stasera';
  const v=$('#view'),y=v.scrollTop;
  if(h!=='sos')LASTTAB=h;
  v.innerHTML=TABS[h]();
  if(h===curTab||keep)v.scrollTop=y;else v.scrollTop=0;curTab=h;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===h?'page':'false'));
  cta();fab();
  if(h==='piano')requestAnimationFrame(drawCurve);
  v.querySelectorAll('.chips.scroll,.rcards').forEach(r=>{const on=r.querySelector('[aria-pressed="true"]');if(on&&on.offsetLeft+on.offsetWidth>r.clientWidth)r.scrollLeft=on.offsetLeft-16});
}
function live(){ // aggiornamento senza ridisegnare tutto (slider)
  const d=deriveX(S.cfg);const set=(id,html)=>{const e=document.getElementById(id);if(e)e.innerHTML=html};
  set('res',vRes(d));set('perP',perP(d));set('wtemp',wtemp(d));set('fit',vFit(S.cfg,d));set('idroS',vIdroS(S.cfg,d));set('tsum',tsum(d));set('wchk',wchk(d));
  const iv=document.getElementById('idroV');if(iv)iv.textContent=S.cfg.idro+'%';
}

/* ============ eventi ============ */
document.addEventListener('click',async e=>{
  const tb=e.target.closest('#tabs button');if(tb){location.hash=tb.dataset.tab;return}
  if(e.target.matches&&e.target.matches('input[type=datetime-local]')){try{e.target.showPicker&&e.target.showPicker()}catch(err){}}
  if(e.target.id==='scrim'){if(SHEET==='edit'&&E&&E.dirty){E.armClose=true;rerenderSheet();toast('Hai modifiche non salvate: salva o chiudi');return}closeSheet();return}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v,k=b.dataset.k;
  const inSheet=!!b.closest('#sheet'),inCook=!!b.closest('#cook');
  switch(a){
    case'set':{const val=JSON.parse(v);setK(k,val);after(k);break}
    case'step':{const cur=+b.dataset.cur||0,st=+v;let n=r1(cur+st);n=clamp(n,+b.dataset.min,+b.dataset.max);setK(k,n);after(k);break}
    case'tog1':setK(k,!getK(k));after(k);break;
    case'tog':{const arr=getK(k)||[];const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);setK(k,arr);break}
    case'settings':openSheet('settings');return;
    case'gloss':openSheet('gloss');return;
    case'term':openSheet('gloss',v);return;
    case'close':if(SHEET==='edit'&&E&&E.dirty&&!E.armClose){E.armClose=true;rerenderSheet();toast('Hai modifiche non salvate');return}
      if(SHEET==='how'&&HOWPREV&&HOWPREV!=='how'){const k=HOWPREV;HOWPREV=null;openSheet(k,'keep');return}HOWPREV=null;closeSheet();render(true);return;
    case'go':location.hash=v;return;
    case'startnow':{const c=S.cfg,t=times(c);c.mode='range';c.start=Date.now();c.end=t.end;c.H=Math.round((c.end-c.start)/H);break}
    case'usestyle':{applyStyle(v);if(SHEET==='wiz'){rerenderSheet();save();return}break}
    case'pickstyle':{applyStyle(v);toast(STY[v].name+': valori impostati');break}
    case'useidro':if(SHEET==='edit')E.c.idro=+v;else S.cfg.idro=+v;toast('Idratazione al '+v+'%');break;
    case'applystyle':applyStyle(v);break;
    case'mkplan':{const p=buildX(S.cfg);if(p.err){toast(p.err);return}S.plan=p;save();location.hash='piano';toast('Piano creato');return}
    case'done':{const p=S.plan;p.done[v]=!p.done[v];const s=p.steps.find(x=>x.id===v);if(s&&s.tag==='freeze'&&p.done[v])S.frozen.unshift({date:Date.now(),n:p.freezeN,w:p.w,style:p.style,remE:remAtStaglio(p),ypct:p.ypct});break}
    case'bell':{const s=S.plan.steps.find(x=>x.id===v);if(s)s.rem=!s.rem;break}
    case'recalc':case'shift':{let ne;if(a==='shift')ne=S.plan&&S.plan.active?S.plan.end+(+v)*M:0;else{const iv=$('#newEnd');ne=iv&&iv.value?+new Date(iv.value):0}
      if(!S.plan||!S.plan.active||!ne){toast('Nessun piano da ricalcolare');return}
      const r=recalc(ne);if(r.err){toast(r.err);return}save();if(location.hash!=='#piano')location.hash='piano';else render(true);toast(r.msg||'Ricalcolato');return}
    case'delplan':if(!S.delArm){S.delArm=true;render(true);setTimeout(()=>{S.delArm=false;if(location.hash==='#piano')render(true)},4000);return}S.delArm=false;S.plan=null;break;
    case'copyplan':{const p=S.plan;const txt=p.steps.filter(s=>s.rem).map(s=>`${dayLab(s.t)} ${fT(s.t)} · ${s.title}`).join('\n');try{await navigator.clipboard.writeText(txt);toast('Orari copiati: incollali nei Promemoria')}catch(err){toast('Non riesco a copiare da qui')}return}
    case'ics':{icsDownload();return}
    case'cook':openCook();return;
    case'cookclose':closeCook();render(true);return;
    case'cookdone':{S.plan.done[v]=true;const s=S.plan.steps.find(x=>x.id===v);if(s&&s.tag==='freeze')S.frozen.unshift({date:Date.now(),n:S.plan.freezeN,w:S.plan.w,style:S.plan.style,remE:remAtStaglio(S.plan),ypct:S.plan.ypct});save();$('#cook').innerHTML=vCook();return}
    case'shiftrest':{toast(shiftRest(+v));render(true);return}
    case'plus5':{const p=S.plan,now=Date.now();p.steps.forEach(s=>{if(!p.done[s.id]&&s.t>now-60*M)s.t+=5*M});p.end+=5*M;p.segs.forEach(g=>{if(g.b>now)g.b+=5*M;if(g.a>now)g.a+=5*M});save();if($('#cook').classList.contains('open'))$('#cook').innerHTML=vCook();else render(true);toast('Spostato tutto di 5 minuti');return}
    case'sosph':S.sos.phase=v;S.sos.sel=[];break;
    case'sosp':{const s=S.sos.sel,i=s.indexOf(v);if(i>=0)s.splice(i,1);else s.push(v);break}
    case'sos2diary':{DRAFT=newDraft();DRAFT.defects=S.sos.sel.slice();DRAFT.next=S.sos.sel.map(id=>FIX[id].next).join(' ');openSheet('draft');return}
    case'thaw':S.thawIdx=+v;if(+v>=0&&!S.thawT)S.thawT=defEnd(0);break;
    case'frozenuse':S.frozen.splice(+v,1);S.thawIdx=-1;toast('Buona pizza!');break;
    case'frozenadd':S.frozen.unshift({date:Date.now(),n:1,w:S.cfg.w,style:S.cfg.style});toast('Aggiunto un panetto');break;
    case'oven':S.ovenId=v;S.delOv=false;break;
    case'ovenadd':{const o=defOven();o.name='Forno '+(S.ovens.length+1);S.ovens.push(o);S.ovenId=o.id;break}
    case'ovendel':if(!S.delOv){S.delOv=true;render(true);return}S.ovens=S.ovens.filter(o=>o.id!==S.ovenId);S.ovenId=S.ovens[0].id;S.delOv=false;break;
    case'ovtype':{const o=curOven();o.type=v;if(v==='gas'&&o.tmax<400)o.tmax=450;if(v==='wood'&&o.tmax<400)o.tmax=480;if((v==='home'||v==='homegas')&&o.tmax>320)o.tmax=250;break}
    case'calreset':curOven().cal={shelf:null,pre:null,dt:0,grill:8};toast('Calibrazione azzerata');break;
    case'testnew':TEST=newTest();openSheet('test');return;
    case'testdo':{const A=analyze(TEST,curOven());TEST._A=A;openSheet('testres',A);return}
    case'testsave':{const o=curOven(),A=TEST._A||[],top=A.find(x=>x.cal)||A[0];
      if(v==='all'){o.cal.shelf=TEST.shelf;o.cal.pre=TEST.pre;const g0=bakeGuide(S.cfg.style,{...o,cal:{}});o.cal.dt=r1(TEST.min-g0.bake)}
      else if(top&&top.cal){for(const kk of ['shelf','pre','dt','grill'])if(top.cal[kk]!=null)o.cal[kk]=top.cal[kk]}
      o.tests.unshift({date:Date.now(),fnL:(FNS.find(x=>x[0]===TEST.fn)||[,''])[1],tset:TEST.tset,ok:!A.length,top:A.length?(top.cal?'Cambiato: '+top.cal.label:top.txt):'Calibrazione salvata'});o.tests=o.tests.slice(0,20);
      TEST=null;save();closeSheet();render(true);toast(A.length?'Test salvato':'Calibrazione salvata');return}
    case'dnew':DRAFT=newDraft();openSheet('draft');return;
    case'sqadd':{const T=SQT[v],q=SHEET==='edit'?E.seq:DRAFT.seq;q.push({type:v,label:T[0],d:T[1],note:''});if(SHEET==='edit')E.open=q.length-1;rerenderSheet();return}
    case'sqdel':{const q=SHEET==='edit'?E.seq:DRAFT.seq;q.splice(+v,1);if(SHEET==='edit')E.open=-1;rerenderSheet();return}
    case'sqmv':{const [i,dir]=v.split(':').map(Number),j=i+dir,q=SHEET==='edit'?E.seq:DRAFT.seq;if(j<0||j>=q.length)return;[q[i],q[j]]=[q[j],q[i]];if(SHEET==='edit')E.open=j;rerenderSheet();return}
    case'sqopen':E.open=E.open===+v?-1:+v;rerenderSheet();return;
    case'bkout':{const data=JSON.stringify({app:'mypizzeria',v:2,at:Date.now(),S});const fn='mypizzeria-backup-'+new Date().toISOString().slice(0,10)+'.json';
      if(DL){DL.save({filename:fn,data}).then(()=>toast('Backup pronto')).catch(()=>toast('Download annullato'));return}
      try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download=fn;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Backup salvato')}catch(e){toast('Non riesco a salvare il file')}return}
    case'sos':location.hash='sos';return;
    case'fitapply':{const [kk,vv]=JSON.parse(v),c=S.cfg;if(kk==='cfg.w'&&c.qMode==='flour')c.flourPer=Math.max(50,Math.round(vv/doughK(c)/5)*5);else setK(kk,vv);
      if(kk==='cfg.H'){c.mode='hours';c.start=c.end-c.H*H}afterCfg(kk);c.mod=true;toast('Fatto');break}
    case'stagset':{const c=S.cfg;if(c.rseq&&c.rseq.length)c.rseq=seqStagTo(c.rseq,v);else{c.stag=v;afterCfg('cfg.stag')}c.stag=v;c.mod=true;break}
    case'rreset':{const c=S.cfg,keep={mode:c.mode,H:c.H,end:c.end,start:c.start,n:c.n,fMode:c.fMode,F:c.F,qMode:c.qMode};
      if(c.rid&&rById(c.rid)){applyRecipe(rById(c.rid));Object.assign(c,keep)}else{Object.assign(c,keep);if(c.stag==='subito'){c.stag='dopo';afterCfg('cfg.stag')}applyStyle(c.style)}toast('Ricetta ripristinata');break}
    case'back':location.hash=LASTTAB||'stasera';return;
    case'pickrec':{const r=rById(v);if(!r)return;applyRecipe(r);save();if(SHEET)closeSheet();if(location.hash!=='#stasera')location.hash='stasera';else render();toast(r.name+': pronta per stasera');return}
    case'redit':E=edFromCfg();openSheet('edit');return;
    case'ropen':{const r=rById(v);if(!r)return;E=edFromRecipe(r);openSheet('edit');return}
    case'copen':E=edFromStyle(v);openSheet('edit');return;
    case'rnew':E=edFromStyle(S.cfg.style);E.kind='mine';E.seq=edSeqPreview();E.name='';openSheet('edit');return;
    case'eseqon':E.seq=edSeqPreview();E.kind='mine';E.open=-1;rerenderSheet();return;
    case'esave':{const r=edSave();if(!r)return;save();rerenderSheet();render(true);toast('Ricetta salvata');return}
    case'euse':{const keep={mode:S.cfg.mode,H:S.cfg.H,end:S.cfg.end,start:S.cfg.start,fMode:S.cfg.fMode,F:S.cfg.F};
      if(E.seq&&E.seq.length){const r=edSave();if(!r)return;applyRecipe(r);if(E.from==='stasera')Object.assign(S.cfg,keep)}
      else{Object.assign(S.cfg,cfgDet(E.c));S.cfg.style=E.c.style;S.cfg.rid=null;S.cfg.rseq=null;S.cfg.rname='';if(E.from!=='stasera')Object.assign(S.cfg,{mode:E.c.mode,H:E.c.H,start:E.c.start,end:E.c.end})}
      E=null;save();closeSheet();if(location.hash!=='#stasera')location.hash='stasera';else render();toast('Pronta per stasera');return}
    case'edel':{if(S.delR!==E.id){S.delR=E.id;rerenderSheet();setTimeout(()=>{S.delR=null},4000);return}
      S.recipes=S.recipes.filter(r=>r.id!==E.id);if(S.cfg.rid===E.id)applyStyle(S.cfg.style);S.delR=null;E=null;save();closeSheet();render(true);toast('Ricetta eliminata');return}
    case'howshow':HOWK=v;HOWPREV=SHEET;openSheet('how');return;
    case'impopen':IMP={text:'',busy:false,res:null,err:''};openSheet('imp');return;
    case'impread':impRead();return;
    case'impsave':case'impfix':{const B=IMP.res;if(!B)return;let seq=B.seq;
      if(!seq.length){const c={...S.cfg,...B.det,style:B.style,rid:null,rseq:null};const pp=buildPlan(c);seq=pp.err?[]:planToSeq(pp)}
      const r={id:'r'+uid(),kind:'import',name:(B.name||'').trim()||'Ricetta importata',style:B.style,det:B.det,seq,created:Date.now()};S.recipes.unshift(r);IMP=null;save();
      if(a==='impfix'){E=edFromRecipe(r);openSheet('edit');render(true);return}
      closeSheet();location.hash='ricette';toast('Ricetta salvata');return}
    case'askopen':if(!ASK)ASK={msgs:[],busy:false,q:'',err:''};openSheet('ask');{const sh=$('#sheet');sh.scrollTop=sh.scrollHeight}return;
    case'askq':askSend(v);return;
    case'asksend':askSend(($('#askIn')||{}).value||ASK.q);return;
    case'askshift':{const L=ASK.msgs[ASK.msgs.length-1];L.done=true;toast(shiftRest(+v));rerenderSheet();render(true);return}
    case'askno':ASK.msgs[ASK.msgs.length-1].done=true;rerenderSheet();return;
    case'fadd':DRAFT.fields.push({k:'',v:''});rerenderSheet();return;
    case'fdel':DRAFT.fields.splice(+v,1);rerenderSheet();return;
    case'dedit':{const e=S.diary.find(x=>x.id===v);if(!e)return;DRAFT=JSON.parse(JSON.stringify(e));DRAFT._edit=true;DRAFT._nextEdited=true;DRAFT.abOn=!!e.ab;if(!DRAFT.ab)DRAFT.ab={v:'appretto',a:'',b:'',ra:0,rb:0};if(!DRAFT.det)DRAFT.det={};if(!DRAFT.seq)DRAFT.seq=[];if(!DRAFT.fields)DRAFT.fields=[];openSheet('draft');return}
    case'ddef':{const d=DRAFT.defects,i=d.indexOf(v);if(i>=0)d.splice(i,1);else d.push(v);if(!DRAFT._nextEdited)DRAFT.next=d.map(id=>FIX[id].next).join(' ');rerenderSheet();return}
    case'dsave':{const d=DRAFT;const e={id:d.id,date:d.date,rid:d.rid||null,seq:(d.seq||[]).map(x=>({...x,d:+x.d||0})).filter(x=>x.d>0),fields:(d.fields||[]).filter(f=>(f.k||'').trim()||(f.v||'').trim()),name:(d.name||'').trim(),style:d.style,rating:d.rating,defects:d.defects,note:d.note,next:d.next,photo:d.photo,params:d.params,det:d.det,ab:d.abOn?d.ab:null};
      if(e.seq.length&&(d.saveAs==='new'||(d.saveAs==='upd'&&rById(d.rid)))){const base={...cfgDet(S.cfg),...detToCfg(d.det),freezeN:0,pdr:0};
        if(d.saveAs==='upd'){const r=rById(d.rid);r.seq=JSON.parse(JSON.stringify(e.seq));r.det={...r.det,...detToCfg(d.det)};r.style=e.style;if(S.cfg.rid===r.id){S.cfg.rseq=JSON.parse(JSON.stringify(e.seq))}}
        else{const r={id:'r'+uid(),kind:'mine',name:e.name||(STY[e.style]||{}).name||'La mia pizza',style:e.style,det:base,seq:JSON.parse(JSON.stringify(e.seq)),created:Date.now()};S.recipes.unshift(r);e.rid=r.id}}
      const ix=S.diary.findIndex(x=>x.id===e.id);if(ix>=0)S.diary[ix]=e;else S.diary.unshift(e);if(!LS.set('mypizzeria.v1',S)){e.photo=null;if(!LS.set('mypizzeria.v1',S)){S.diary.shift();toast('Spazio pieno: non salvato');return}toast('Salvata senza foto: spazio pieno')}else toast('Infornata salvata');
      DRAFT=null;closeSheet();location.hash='diario';render(true);return}
    case'ddel':if(S.delD!==v){S.delD=v;render(true);return}S.diary=S.diary.filter(x=>x.id!==v);S.delD=null;break;
    case'wiz':{WIZ+=+v;if(WIZ>4){WIZ=0;S.setup=true;save();closeSheet();render();toast('Pronto. Buona pizza!');return}WIZ=Math.max(0,WIZ);rerenderSheet();save();return}
    case'wizstart':WIZ=0;openSheet('wiz');return;
    case'reset':if(!S.rstArm){S.rstArm=true;rerenderSheet();return}try{localStorage.removeItem('mypizzeria.v1')}catch(err){}location.reload();return;
  }
  save();
  if(inCook)return;
  if(inSheet)rerenderSheet();
  render(true);
});

  if(t.type==='range'){t.style.setProperty('--p',((t.value-t.min)/(t.max-t.min)*100)+'%');setK(k,+t.value);after(k);save();if(k.startsWith('e.'))liveE();else live();return}
  if(t.tagName==='TEXTAREA'||t.type==='text'){setK(k,t.value);if(k==='d.next')DRAFT._nextEdited=true;save();return}
});

  if(e.target.id==='bkIn'){const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result),st=j&&j.app==='mypizzeria'?j.S:j;
      if(!st||!st.cfg||!Array.isArray(st.diary))throw 0;localStorage.setItem('mypizzeria.v1',JSON.stringify(st));toast('Backup caricato');setTimeout(()=>location.reload(),600)}catch(err){toast('Questo file non è un backup di MyPizzeria')}};rd.readAsText(f);return}
  const t=e.target;
  if(t.id==='dphoto'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,640/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);DRAFT.photo=cv.toDataURL('image/jpeg',.72);rerenderSheet()};im.src=r.result};r.readAsDataURL(t.files[0]);return}
  const k=t.dataset&&t.dataset.k;if(!k)return;
  let v=t.value;
  if(t.dataset.type==='dt'){if(!v)return;v=+new Date(v)}
  else if(t.type==='number'){v=v===''?(k==='cont.h0'||k==='t.treal'?null:0):+v.replace(',','.')}
  else if(t.type==='range')v=+v;
  else if(t.tagName==='TEXTAREA'||t.type==='text')return;
  setK(k,v);after(k);
  if(k==='cont.id')S.cont.h0=null;
  save();
  if(t.closest('#sheet')){rerenderSheet();return}
  render(true);
});

let DL=null;try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(x=>{DL=x}).catch(()=>{})}catch(e){}
async function icsDownload(){
  const p=S.plan;if(!p)return;
  const z=ms=>new Date(ms).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const ev=p.steps.filter(s=>s.rem).map(s=>['BEGIN:VEVENT','UID:'+s.id+'@mypizzeria','DTSTAMP:'+z(Date.now()),'DTSTART:'+z(s.t),'DTEND:'+z(s.t+Math.max(5,Math.min(s.d,60))*M),'SUMMARY:🍕 '+s.title.replace(/[,;]/g,' '),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+s.title.replace(/[,;]/g,' '),'TRIGGER:'+(s.tag==='fridgeOut'?'-PT15M':'PT0M'),'END:VALARM','END:VEVENT'].join('\r\n'));
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MyPizzeria//IT'].concat(ev,['END:VCALENDAR']).join('\r\n');
  if(DL){DL.save({filename:'mypizzeria.ics',data:ics}).then(()=>toast('File calendario pronto')).catch(()=>toast('Download annullato'));return}
  try{const u=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));const l=document.createElement('a');l.href=u;l.download='mypizzeria.ics';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Se il file non parte, usa «Copia gli orari»')}catch(e){toast('Da qui non posso scaricare: usa «Copia gli orari»')}
}
